name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test (IMDB subset)
        env:
          HF_HOME: ${{ github.workspace }}/.hf_cache
          HF_DATASETS_CACHE: ${{ github.workspace }}/.hf_cache/datasets
        run: |
          python run_lab2.py \
            --dataset imdb \
            --seed 42 \
            --max_rows 400 \
            --vectorizer tfidf \
            --model logreg \
            --output_dir outputs

      - name: Verify IMDB outputs
        run: |
          test -f outputs/logs/data_audit.md
          test -f outputs/metrics/metrics_summary.json
          test -f outputs/figures/confusion_matrix.png
          test -f outputs/error_analysis/error_analysis.csv
          test -f outputs/pipeline/model_pipeline.joblib

      - name: Run Vietnamese local CSV smoke test
        run: |
          python run_lab2.py \
            --dataset local_csv \
            --data_path data/raw/sample_vietnews_tiny.csv \
            --text_col content \
            --label_col category \
            --language vi \
            --vi_segment none \
            --vectorizer tfidf \
            --model logreg \
            --analyzer word \
            --ngram_min 1 \
            --ngram_max 2 \
            --seed 42 \
            --output_dir outputs_vn

      - name: Verify Vietnamese outputs
        run: |
          test -f outputs_vn/logs/data_audit.md
          test -f outputs_vn/metrics/metrics_summary.json
          test -f outputs_vn/figures/confusion_matrix.png
          test -f outputs_vn/error_analysis/error_analysis.csv
          test -f outputs_vn/predictions/test_predictions.csv

      - uses: actions/upload-artifact@v4
        with:
          name: lab2-outputs
          path: |
            outputs/
            outputs_vn/
          if-no-files-found: error
